<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenShort</title>
    <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    rel="stylesheet"
/>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="logo">
        <img src="assets/logo.png" alt="logo" class="logo-img">
        <span class="logo-text">OpenShort</span>
    </div>

    <div class="main-content">
        <span class="material-symbols-outlined">
            check_circle
        </span>
        <h1>Your link is ready!</h1>

        <div class="card"></div>
        <span>Short URL</span>
            <input type="url"/>
            <button class="enter">
                Copy URL
        </button>

<div class="original-url">
    <strong>Original URL</strong>
    <span>https://verylongdestination.com/path/to/resource...</span>
</div>


    <button class="create">Create another</button>
</div>
</div>

    <footer class="footer">Open-source • Self-hosted • Free</footer>
</body>
</html>
