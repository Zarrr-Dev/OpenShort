<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenShort</title>
    <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    rel="stylesheet"
/>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="logo">
        <img src="assets/logo.png" alt="logo" class="logo-img">
        <span class="logo-text">OpenShort</span>
    </div>

    <div class="main-content">
        <span class="material-symbols-outlined">
            check_circle
        </span>
        <h1>Your link is ready!</h1>

        <div class="card">
        <span>Short URL</span>
            <input type="text" value="URL" readonly id="outputUrl"/>
            <button class="btn-main" id="copyBtn">
                Copy URL
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-copy" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z"/>
                </svg>
        </button>
    </div>
    <div class="original-url">
    <strong>Original URL</strong>
    <span>https://verylongdestination.com/path/to/resource...</span>
</div>

    <button class="btn-create">+ Create another</button>
</div>
</div>

    <footer class="footer">Open-source • Self-hosted • Free</footer>
    <script src="Index.js"></script>
</body>
</html>
